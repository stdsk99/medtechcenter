<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>วิชาของฉัน · ศูนย์การเรียนรู้เทคโนโลยีทางการแพทย์</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body data-page="my">
<header class="site-head"></header>
<main id="main" class="wrap" style="padding-top:28px;padding-bottom:24px">
  <div id="my"></div>
  <div id="acct"></div>
</main>
<footer class="site-foot"></footer>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/courses.js"></script>
<script src="js/site.js"></script>
<script>
(function(){
  const M = window.MTC, esc = M.esc, S = window.SITE, CS = window.COURSES||[];
  const root = document.getElementById("my");
  if(!M.session()){ location.replace("login.html?next=my.html"); return; }
  const thDate = iso=>{ try{ return new Date(iso).toLocaleDateString("th-TH",{year:"numeric",month:"long",day:"numeric"}); }catch(e){ return ""; } };

  function render(data, loading, error){
    const s = M.session(); if(!s) return;
    const p = s.profile, enrolled = (data && data.enrolled) || s.enrolled || [];
    const prog = (data && data.progress) || {}, certs = (data && data.certs) || [];
    const mine = CS.filter(c=>enrolled.includes(c.id)), others = CS.filter(c=>!enrolled.includes(c.id));
    root.innerHTML = `
      <div class="my-head">
        <div>
          <span class="muted">สวัสดี</span>
          <h1>${esc(p.name)}</h1>
          <span class="muted">${p.type==="gp" ? `บุคลากร / บุคคลทั่วไป · ${esc(p.org||"-")}` : `นักศึกษา · รหัส ${esc(p.sid)}${p.sec?" · กลุ่ม "+esc(p.sec):""}`}</span>
        </div>
        <button class="btn btn-outline btn-sm" id="out" type="button">ออกจากระบบ</button>
      </div>
      ${error ? `<div class="msg bad" role="alert">${esc(error)}</div>` : ""}
      <h2 class="h-sec">วิชาที่ลงทะเบียน</h2>
      ${mine.length ? `<div class="my-grid">${mine.map(c=>card(c, prog[c.id], certs.filter(x=>x.app===c.id), loading)).join("")}</div>`
        : `<div class="empty">ยังไม่ได้ลงทะเบียนวิชาใด เลือกวิชาด้านล่างเพื่อเริ่มเรียน</div>`}
      ${others.length ? `<h2 class="h-sec">วิชาอื่นที่เปิดให้เรียน</h2>
        <div class="my-grid">${others.map(c=>`<a class="mini-course" href="course.html?c=${c.id}"><span class="mini-art art-${c.art}">${window.COURSE_ART[c.id]||""}</span><span><b>${esc(c.th)}</b><small>${esc(c.en)}</small><span class="go">ดูรายละเอียดและลงทะเบียน →</span></span></a>`).join("")}</div>` : ""}`;
    document.getElementById("out").onclick = ()=>{ M.logout(); location.href = "./"; };
    root.querySelectorAll("[data-cert]").forEach(b=>b.onclick = async ()=>{
      const m = b.parentNode.querySelector(".msg"), label = b.textContent;
      b.disabled = true; b.textContent = "กำลังออกเกียรติบัตร…"; m.hidden = true;
      const r = await M.cert(b.dataset.cert);
      b.disabled = false; b.textContent = label;
      if(!r.ok){ if(M.isAuthErr(r)){ location.replace("login.html?next=my.html"); return; } m.className = "msg bad"; m.textContent = M.errText(r); m.hidden = false; return; }
      const url = M.savePdf(r.b64, r.file || "Certificate.pdf");
      m.className = "msg ok"; m.hidden = false;
      m.innerHTML = `ได้รับเกียรติบัตร เลขที่ <b>${esc(r.ref)}</b> แล้ว ถ้าไฟล์ไม่ดาวน์โหลดเอง <a href="${url}" download="${esc(r.file||"Certificate.pdf")}" target="_blank" rel="noopener">กดที่นี่เพื่อเปิด PDF</a>`;
    });
  }

  function card(c, g, certs, loading){
    const url = (S.apps||{})[c.id] || "#";
    /* ข้อเกณฑ์มาจากหลังบ้าน (rows) ถ้ายังโหลดไม่เสร็จ ใช้รายการเกณฑ์จาก courses.js */
    if(!g) g = {pct:0, pass:false, rows:(c.crit||[]).map(t=>({t, v:"", ok:false}))};
    const rows = g.rows || [];
    const row = r=>`<li class="${r.ok?"done":""}"><span>${r.ok?"✓":"○"} ${esc(r.t)}</span><span class="muted">${esc(r.v)}</span></li>`;
    const status = loading ? `<span class="pill pill-grey">กำลังโหลด…</span>` : g.pass ? `<span class="pill pill-ok">ผ่านเกณฑ์แล้ว</span>` : g.pct ? `<span class="pill pill-run">กำลังเรียน ${g.pct}%</span>` : `<span class="pill pill-grey">ยังไม่เริ่ม</span>`;
    return `<article class="prog-card">
      <div class="prog-top"><span class="mini-art art-${c.art}">${window.COURSE_ART[c.id]||""}</span>
        <div><h3>${esc(c.th)}</h3><small class="muted">${esc(c.en)}</small></div>${status}</div>
      <div class="bar" role="progressbar" aria-label="ความคืบหน้า ${esc(c.th)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${g.pct}"><i style="width:${g.pct}%"></i></div>
      <ul class="crit-rows">${rows.map(row).join("")}</ul>
      ${certs.length ? `<div class="cert-row">${certs.map(x=>`<div><b>เกียรติบัตร เลขที่ ${esc(x.ref)}</b><small class="muted">ออกเมื่อ ${thDate(x.date)}</small></div>`).join("")}</div>` : ""}
      ${certs.length || g.pass ? `<div class="cert-dl"><button class="btn btn-outline btn-sm" type="button" data-cert="${c.id}">ดาวน์โหลดเกียรติบัตร (PDF)</button>
        ${certs.length ? "" : `<small class="muted">ผ่านเกณฑ์แล้ว กดเพื่อรับเกียรติบัตร ครั้งแรกอาจใช้เวลา 10–30 วินาที</small>`}<div class="msg" role="status" hidden></div></div>` : ""}
      <div class="prog-actions"><a class="btn btn-primary btn-sm" href="${esc(url)}">${g.pct?"เรียนต่อ →":"เริ่มเรียน →"}</a>
        <a class="btn btn-ghost btn-sm" href="course.html?c=${c.id}">รายละเอียดวิชา</a></div>
    </article>`;
  }

  /* บัญชีของฉัน: เปลี่ยนรหัสผ่าน */
  function account(){
    const a = document.getElementById("acct");
    a.innerHTML = `<h2 class="h-sec">บัญชีของฉัน</h2>
      <details class="acct-box"><summary>เปลี่ยนรหัสผ่าน</summary>
        <form id="cp" novalidate>
          ${M.pwField("cp-o", "รหัสผ่านปัจจุบัน", "current-password", false)}
          ${M.pwField("cp-n", "รหัสผ่านใหม่", "new-password", true)}
          ${M.pwField("cp-n2", "ยืนยันรหัสผ่านใหม่", "new-password", false)}
          <p class="muted small">เมื่อเปลี่ยนแล้ว เครื่องอื่นที่เคยเข้าสู่ระบบไว้จะต้องเข้าสู่ระบบใหม่</p>
          <div class="msg" id="cp-m" role="status" hidden></div>
          <button class="btn btn-primary" type="submit" id="cp-go">บันทึกรหัสผ่านใหม่</button>
        </form>
      </details>`;
    M.bindPw(a);
    a.querySelector("#cp").onsubmit = async e=>{
      e.preventDefault();
      const m = a.querySelector("#cp-m"), say = (t, ok)=>{ m.textContent=t; m.className="msg "+(ok?"ok":"bad"); m.hidden=false; };
      const old = a.querySelector("#cp-o").value, pw = a.querySelector("#cp-n").value;
      if(!old) return say("กรุณากรอกรหัสผ่านปัจจุบัน");
      const bad = M.pwProblem(pw, a.querySelector("#cp-n2").value); if(bad) return say(bad);
      const go = a.querySelector("#cp-go"); go.disabled=true; go.textContent="กำลังบันทึก…";
      const r = await M.changePassword(old, pw);
      go.disabled=false; go.textContent="บันทึกรหัสผ่านใหม่";
      if(!r.ok){ if(M.isAuthErr(r)){ M.logout(); location.replace("login.html?next=my.html"); return; } return say(M.errText(r)); }
      a.querySelectorAll("input").forEach(i=>i.value=""); a.querySelectorAll(".pw-rules li").forEach(li=>li.classList.remove("ok"));
      say("เปลี่ยนรหัสผ่านเรียบร้อยแล้ว", true);
    };
  }

  render(null, true);
  account();
  M.refresh().then(r=>{
    if(r.ok) render(r, false);
    else if(M.isAuthErr(r)) location.replace("login.html?next=my.html");
    else render(null, false, M.errText(r) + " · ข้อมูลที่แสดงอาจยังไม่เป็นปัจจุบัน");
  });
})();
</script>
</body>
</html>
